name: Security CI

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Semgrep scan
        run: |
          docker run --rm -v "$PWD/project/starter-app:/src" \
            semgrep/semgrep semgrep --config p/default --config p/owasp-top-ten --error /src

      - name: Gitleaks scan
        if: always()
        run: |
          docker run --rm -v "$PWD/project/starter-app:/repo" \
            zricethezav/gitleaks:latest detect --no-git -s /repo -v

      - name: Trivy scan
        if: always()
        run: |
          docker run --rm -v "$PWD/project/starter-app:/src" \
            aquasec/trivy fs --severity HIGH,CRITICAL --exit-code 1 /src
